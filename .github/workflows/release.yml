name: Release

# Builds the signed Android App Bundle (.aab) to upload to Google Play.
# Run it from the Actions tab ("Release" → "Run workflow"). Needs these repository secrets:
#   UPLOAD_KEYSTORE_BASE64  the upload keystore (.jks), base64-encoded
#   UPLOAD_KEYSTORE_PASSWORD, UPLOAD_KEY_ALIAS, UPLOAD_KEY_PASSWORD
# See docs/play-store/RELEASE.md.

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore upload keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The UPLOAD_KEYSTORE_BASE64 secret is not set. See docs/play-store/RELEASE.md."
            exit 1
          fi
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release bundle
        env:
          FLIPCOIN_KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          FLIPCOIN_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          FLIPCOIN_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FLIPCOIN_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          # Play needs a higher version code for every upload.
          FLIPCOIN_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: flipcoin-release-aab
          path: app/build/outputs/bundle/release/*.aab

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
